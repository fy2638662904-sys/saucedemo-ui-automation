[pytest]
testpaths = tests
pythonpath = .
addopts =
    -v
    --tb=short
    --strict-markers
    --browser chromium
    --browser-channel chrome
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output reports/artifacts
markers =
    ui: UI 自动化用例
    smoke: 冒烟用例
    regression: 回归用例
